<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة لوحة شرف الأوائل - مادة الدراسات الاجتماعية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); min-height: 100vh; padding: 30px 15px; color: #333; display: flex; justify-content: center; align-items: flex-start; }
        .leaderboard-card { background: #ffffff; width: 100%; max-width: 850px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); overflow: hidden; border: 3px solid #f1c40f; }
        .header { background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%); color: #fff; padding: 35px 20px; text-align: center; }
        .header h1 { font-size: 2.2rem; margin-bottom: 8px; color: #f1c40f; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        .header p { font-size: 1.1rem; opacity: 0.9; font-weight: bold; }
        .podium { display: flex; justify-content: center; align-items: flex-end; padding: 30px 20px 10px; gap: 15px; background: #f8f9fa; }
        .podium-item { display: flex; flex-direction: column; align-items: center; flex: 1; max-width: 180px; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; font-weight: bold; color: white; box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin-bottom: 10px; }
        .rank-1 .avatar { background: #f1c40f; border: 4px solid #fff; width: 85px; height: 85px; font-size: 2.2rem; }
        .rank-2 .avatar { background: #bdc3c7; border: 4px solid #fff; }
        .rank-3 .avatar { background: #e67e22; border: 4px solid #fff; }
        .podium-box { width: 100%; text-align: center; padding: 15px 10px; border-radius: 12px 12px 0 0; color: white; font-weight: bold; }
        .rank-1 .podium-box { background: linear-gradient(to top, #f39c12, #f1c40f); height: 110px; }
        .rank-2 .podium-box { background: linear-gradient(to top, #7f8c8d, #bdc3c7); height: 85px; }
        .rank-3 .podium-box { background: linear-gradient(to top, #d35400, #e67e22); height: 65px; }
        .student-name { font-size: 1rem; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score-tag { background: rgba(255, 255, 255, 0.3); padding: 3px 8px; border-radius: 10px; font-size: 0.85rem; }
        .table-container { padding: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { background-color: #2c3e50; color: #ffffff; padding: 14px; font-size: 1rem; text-align: center; }
        td { padding: 12px 15px; text-align: center; border-bottom: 1px solid #ecf0f1; font-size: 0.95rem; }
        tr:nth-child(even) { background-color: #f8f9fa; }
        .top-row-1 { background-color: #fff9e6 !important; font-weight: bold; color: #b7950b; }
        .top-row-2 { background-color: #f2f4f4 !important; font-weight: bold; color: #5d6d7e; }
        .top-row-3 { background-color: #fbeee6 !important; font-weight: bold; color: #a04000; }
        .badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-weight: bold; color: white; background-color: #27ae60; }
        .loading { text-align: center; padding: 20px; font-size: 1.1rem; color: #555; }
        .footer { text-align: center; padding: 15px; background-color: #f1f2f6; color: #7f8c8d; font-size: 0.9rem; font-weight: bold; }
    </style>
</head>
<body>

<div class="leaderboard-card">
    <div class="header">
        <h1>🏆 لوحة شرف أوائل الطلاب 🏆</h1>
        <p>مادة الدراسات الاجتماعية - الصف الثالث الإعدادي</p>
    </div>

    <!-- منصة التتويج -->
    <div class="podium">
        <div class="podium-item rank-2">
            <div class="avatar">🥈</div>
            <div class="podium-box">
                <div class="student-name" id="p2-name">--</div>
                <div class="score-tag" id="p2-score">--</div>
            </div>
        </div>
        <div class="podium-item rank-1">
            <div class="avatar">👑</div>
            <div class="podium-box">
                <div class="student-name" id="p1-name">--</div>
                <div class="score-tag" id="p1-score">--</div>
            </div>
        </div>
        <div class="podium-item rank-3">
            <div class="avatar">🥉</div>
            <div class="podium-box">
                <div class="student-name" id="p3-name">--</div>
                <div class="score-tag" id="p3-score">--</div>
            </div>
        </div>
    </div>

    <!-- جدول بقية الطلاب -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>الترتيب</th>
                    <th>اسم الطالب</th>
                    <th>الصف</th>
                    <th>الدرجة</th>
                </tr>
            </thead>
            <tbody id="students-list">
                <tr>
                    <td colspan="4" class="loading">جاري تحميل البيانات... ⏳</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="footer">
        مع أطيب تمنياتنا لجميع الطلاب بالدوام والتفوق 🌟
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx85tdaD2otu6i1SzcG-HNiJlC3HJYoFo3Lr9p__bRJVUWyRVRVU11FUwHR6Jr1iPD9/exec";

    async function loadData() {
        try {
            const response = await fetch(SCRIPT_URL);
            const data = await response.json();

            // ترتيب تنازلي حسب أعلى درجة
            data.sort((a, b) => b.numScore - a.numScore);

            // منصة التتويج
            if (data[0]) { document.getElementById("p1-name").innerText = data[0].name; document.getElementById("p1-score").innerText = data[0].score; }
            if (data[1]) { document.getElementById("p2-name").innerText = data[1].name; document.getElementById("p2-score").innerText = data[1].score; }
            if (data[2]) { document.getElementById("p3-name").innerText = data[2].name; document.getElementById("p3-score").innerText = data[2].score; }

            // بناء الجدول
            const tbody = document.getElementById("students-list");
            tbody.innerHTML = "";

            data.forEach((student, index) => {
                let rankText = index + 1;
                let rowClass = "";

                if (index === 0) { rankText = "🥇 الأول"; rowClass = "top-row-1"; }
                else if (index === 1) { rankText = "🥈 الثاني"; rowClass = "top-row-2"; }
                else if (index === 2) { rankText = "🥉 الثالث"; rowClass = "top-row-3"; }

                const row = `
                    <tr class="${rowClass}">
                        <td>${rankText}</td>
                        <td>${student.name}</td>
                        <td>${student.class}</td>
                        <td><span class="badge">${student.score}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });

        } catch (error) {
            console.error("خطأ:", error);
            document.getElementById("students-list").innerHTML = `
                <tr>
                    <td colspan="4" style="color:red; font-weight:bold;">حدث خطأ أثناء تحميل البيانات.</td>
                </tr>
            `;
        }
    }

    loadData();
</script>

</body>
</html>
