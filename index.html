<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة شرف الأوائل</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #4a154b;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f8f9fa;
            color: #555;
            font-size: 1.1em;
        }
        /* تمييز الأوائل بألوان مميزة */
        tr.rank-1 {
            background-color: #fff3cd;
            font-weight: bold;
        }
        tr.rank-1 td:first-child::before {
            content: "🥇 ";
        }
        tr.rank-2 {
            background-color: #e2e3e5;
            font-weight: bold;
        }
        tr.rank-2 td:first-child::before {
            content: "🥈 ";
        }
        tr.rank-3 {
            background-color: #ffe8d6;
            font-weight: bold;
        }
        tr.rank-3 td:first-child::before {
            content: "🥉 ";
        }
        .score-badge {
            background: #28a745;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🏆 لوحة شرف الأوائل 🏆</h1>
    <table>
        <thead>
            <tr>
                <th>الترتيب</th>
                <th>اسم الطالب</th>
                <th>الفصل</th>
                <th>الدرجة</th>
            </tr>
        </thead>
        <tbody id="leaderboard">
            <!-- سيتم تحميل البيانات هنا تلقائياً -->
        </tbody>
    </table>
</div>

<script>
    // ضع رابط الـ JSON الخاص بـ Google Sheet أو الـ API هنا
    const SHEET_URL = 'ضع_رابط_البيانات_هنا';

    async function loadLeaderboard() {
        try {
            const response = await fetch(SHEET_URL);
            const data = await response.json();
            const tbody = document.getElementById('leaderboard');
            tbody.innerHTML = '';

            data.forEach((student, index) => {
                const rank = index + 1;
                let rankClass = '';
                if (rank === 1) rankClass = 'rank-1';
                else if (rank === 2) rankClass = 'rank-2';
                else if (rank === 3) rankClass = 'rank-3';

                const row = `
                    <tr class="${rankClass}">
                        <td>${rank}</td>
                        <td>${student.name}</td>
                        <td>${student.class || 'الثالث الإعدادي'}</td>
                        <td><span class="score-badge">${student.score}</span></td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        } catch (error) {
            console.error('خطأ في تحميل البيانات:', error);
        }
    }

    loadLeaderboard();
</script>

</body>
</html>
